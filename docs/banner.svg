<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f3c"/>
      <stop offset="100%" stop-color="#0d3260"/>
    </linearGradient>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#1a4a7a" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Water background -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Pixel grid overlay -->
  <rect width="800" height="200" fill="url(#grid)" opacity="0.25"/>

  <!-- Seaweed (left edge) -->
  <rect x="8"  y="140" width="6" height="60" fill="#155a24"/>
  <rect x="15" y="115" width="6" height="85" fill="#1b7a2f"/>
  <rect x="22" y="100" width="6" height="100" fill="#228b3a"/>
  <rect x="29" y="125" width="6" height="75" fill="#155a24"/>

  <!-- ===== PIXEL FISH ===== -->
  <!-- pixel size p=10, origin ox=40, oy=50 -->
  <!-- T=tail #e74c3c  B=body #f39c12  F=fin #d35400  E/M=dark #1e272e -->

  <!-- Dorsal fin: rows 0-1, cols 7-8 → x=110 y=50 w=20 h=20 -->
  <rect x="110" y="50" width="20" height="20" fill="#d35400"/>

  <!-- Tail row 0 (y=50): col 2 -->
  <rect x="60" y="50" width="10" height="10" fill="#e74c3c"/>
  <!-- Tail row 1 (y=60): cols 1-3 -->
  <rect x="50" y="60" width="30" height="10" fill="#e74c3c"/>
  <!-- Tail rows 2-6 (y=70–110): cols 0-3 — single rect -->
  <rect x="40" y="70" width="40" height="50" fill="#e74c3c"/>
  <!-- Tail row 7 (y=120): cols 1-3 -->
  <rect x="50" y="120" width="30" height="10" fill="#e74c3c"/>
  <!-- Tail row 8 (y=130): col 2 -->
  <rect x="60" y="130" width="10" height="10" fill="#e74c3c"/>

  <!-- Body row 2 (y=70): cols 5-9 -->
  <rect x="90" y="70" width="50" height="10" fill="#f39c12"/>
  <!-- Body row 3 (y=80): cols 4-10 -->
  <rect x="80" y="80" width="70" height="10" fill="#f39c12"/>
  <!-- Body row 4 (y=90): cols 4-11 -->
  <rect x="80" y="90" width="80" height="10" fill="#f39c12"/>
  <!-- Body row 5 (y=100): cols 4-10 -->
  <rect x="80" y="100" width="70" height="10" fill="#f39c12"/>
  <!-- Body row 6 (y=110): cols 5-9 -->
  <rect x="90" y="110" width="50" height="10" fill="#f39c12"/>

  <!-- Eye: row 4 col 9 → x=130 y=90 -->
  <rect x="130" y="90" width="10" height="10" fill="#1e272e"/>
  <rect x="133" y="92" width="3"  height="3"  fill="#ffffff" opacity="0.45"/>

  <!-- Mouth: row 4 col 12 → x=160 y=90 -->
  <rect x="160" y="90" width="10" height="10" fill="#1e272e"/>

  <!-- ===== BUBBLES ===== -->
  <circle cx="210" cy="68"  r="5" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.7"/>
  <circle cx="226" cy="50"  r="3" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="244" cy="90"  r="7" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.55"/>
  <circle cx="258" cy="58"  r="4" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="235" cy="118" r="3" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.4"/>
  <circle cx="220" cy="105" r="4" fill="none" stroke="#7ec8e3" stroke-width="1.5" opacity="0.35"/>

  <!-- ===== TEXT ===== -->
  <text x="295" y="87"
        font-family="'Courier New',Courier,monospace"
        font-size="32" font-weight="bold"
        fill="#a8d8ea">aqua-ai-monitor</text>
  <text x="295" y="110"
        font-family="'Courier New',Courier,monospace"
        font-size="12" fill="#5b8ea6">IoT · Isolation Forest · MJPEG · ESP32</text>
  <text x="295" y="130"
        font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#3a6080">Python · Node.js · C++ · KiCad</text>

  <!-- Status indicator dots (top-right) -->
  <rect x="758" y="15" width="10" height="10" fill="#2ecc71"/>
  <rect x="772" y="15" width="10" height="10" fill="#f39c12"/>
  <rect x="786" y="15" width="10" height="10" fill="#e74c3c"/>
</svg>
